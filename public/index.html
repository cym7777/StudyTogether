<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#faf9f5"><meta name="description" content="三个人一起记录学习、运动和每日进步的轻量自习室。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="三人自习室"><title>StudyTogether｜三人考研自习室</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head>
<body>
 <a class="skip-link" href="#app">跳到学习内容</a>
 <header class="top"><a href="#home" class="brand">StudyTogether <small>三人考研自习室</small></a><button id="refresh" class="quiet">刷新同步</button></header>
 <div id="network" role="status" class="notice" hidden></div>
 <main id="app" tabindex="-1" aria-live="polite"><p>正在读取学习记录…</p></main>
 <nav class="bottom" aria-label="主要导航"><a href="#home">首页</a><a href="#history">历史</a><a href="#stats">统计</a><a href="#settings">设置</a></nav>
 <div id="toast" role="status" hidden></div>
 <dialog id="editor"><form id="task-form"><h2 id="editor-title">添加任务</h2><label>科目<select id="task-subject" required></select></label><label>任务内容<textarea id="task-text" maxlength="1000" required rows="4" placeholder="记录一项具体的学习任务"></textarea></label><p id="task-error" role="alert"></p><div class="actions"><button type="button" id="cancel-task" class="quiet">取消</button><button type="submit" id="submit-task">保存任务</button></div></form></dialog>
 <dialog id="share-dialog"><h2>分享打卡文字</h2><p class="muted">复制后粘贴到 QQ 群。仅包含已经保存的记录。</p><textarea id="share-text" aria-label="打卡分享文字" rows="13" readonly></textarea><p id="copy-status" role="status"></p><div class="actions"><button id="close-share" class="quiet">关闭</button><button id="copy-share">复制到剪贴板</button></div></dialog>
 <noscript><p>请在浏览器中启用 JavaScript，并通过 http://127.0.0.1:8787 打开软件。</p></noscript>
 <script src="./boot.js"></script>
</body></html>
